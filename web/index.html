<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>topflix — qué ver</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">🍿 <span>topflix</span></div>
  <div class="tools">
    <div class="seg" id="mediaSeg">
      <button type="button" data-m="all" class="on">Todo</button>
      <button type="button" data-m="movie">Películas</button>
      <button type="button" data-m="tv">Series</button>
    </div>
    <input id="q" type="search" placeholder="Buscar título…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="onlyMine"> Solo lo que tengo</label>
  </div>
</header>

<p id="meta" class="meta"></p>

<main id="app"><p class="loading">Cargando…</p></main>

<footer class="foot">
  Datos de <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>.
  Sitio personal, solo informativo. <span id="stamp"></span>
</footer>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="x" aria-label="Cerrar">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
