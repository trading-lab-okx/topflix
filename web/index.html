<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>topflix — qué ver</title>
<meta name="description" content="Que ver hoy: tendencias, cine, estrenos y joyas por genero.">

<!-- PWA: instalable como app, sin barra de navegador -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

<!-- iOS no lee el manifest para el icono/modo app: hace falta esto aparte -->
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="topflix">
<meta name="mobile-web-app-capable" content="yes">

<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">🍿 <span>topflix</span></div>
  <div class="seg" id="viewSeg">
    <button type="button" data-v="watch" class="on">🎬 Ver</button>
    <button type="button" data-v="sports">⚽ Deportes</button>
  </div>
  <div class="tools" id="watchTools">
    <div class="seg" id="mediaSeg">
      <button type="button" data-m="all" class="on">Todo</button>
      <button type="button" data-m="movie">Películas</button>
      <button type="button" data-m="tv">Series</button>
    </div>
    <input id="q" type="search" placeholder="Buscar título…" autocomplete="off">
    <label class="chk"><input type="checkbox" id="onlyMine"> Solo lo que tengo</label>
  </div>
</header>

<p id="meta" class="meta"></p>

<main id="app"><p class="loading">Cargando…</p></main>
<main id="sportsApp" hidden><p class="loading">Cargando…</p></main>

<footer class="foot">
  Datos de <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a> y
  <a href="https://api-sports.io/" target="_blank" rel="noopener">API-Sports</a>.
  Sitio personal, solo informativo. <span id="stamp"></span>
</footer>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true">
    <button class="x" aria-label="Cerrar">✕</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
